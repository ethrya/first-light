name: First Light Newsletter

on:
  schedule:
    # 6:30am AEDT (UTC+11) = 19:30 UTC previous day
    # During AEST (Apr-Oct) this fires at 5:30am local time
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      claude_model:
        description: 'Claude model override (e.g. claude-haiku-4-5-20251001)'
        required: false
        default: ''

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send newsletter
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          CLAUDE_MODEL: ${{ github.event.inputs.claude_model }}
        run: python -m src.main
